<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0A2A43">
    <meta name="description" content="Mobile-optimized Battleship game with touch controls">
    <title>⚓ Battleship - Mobile</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- PWA support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
</head>
<body>
    <div class="game-container">
        <div class="landscape-notice">
            📱 For the best experience, try rotating your device to portrait mode
        </div>
        
        <header class="game-header">
            <h1>⚓ BATTLESHIP ⚓</h1>
            <div class="game-status">
                <div class="turn-indicator">
                    <span id="turn-text">Place your ships</span>
                </div>
                <div class="ships-remaining">
                    <div class="player-ships">
                        <h3>Your Ships</h3>
                        <div id="player-ships-count">5</div>
                    </div>
                    <div class="computer-ships">
                        <h3>Enemy Ships</h3>
                        <div id="computer-ships-count">5</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="game-setup" id="setup-phase">
            <div class="setup-controls">
                <h2>Place Your Fleet</h2>
                <div class="ship-selection">
                    <div class="ship-item active" data-ship="carrier" data-size="5">
                        <span class="ship-name">Carrier</span>
                        <div class="ship-preview carrier-preview"></div>
                        <span class="ship-size">(5)</span>
                    </div>
                    <div class="ship-item" data-ship="battleship" data-size="4">
                        <span class="ship-name">Battleship</span>
                        <div class="ship-preview battleship-preview"></div>
                        <span class="ship-size">(4)</span>
                    </div>
                    <div class="ship-item" data-ship="cruiser" data-size="3">
                        <span class="ship-name">Cruiser</span>
                        <div class="ship-preview cruiser-preview"></div>
                        <span class="ship-size">(3)</span>
                    </div>
                    <div class="ship-item" data-ship="submarine" data-size="3">
                        <span class="ship-name">Submarine</span>
                        <div class="ship-preview submarine-preview"></div>
                        <span class="ship-size">(3)</span>
                    </div>
                    <div class="ship-item" data-ship="destroyer" data-size="2">
                        <span class="ship-name">Destroyer</span>
                        <div class="ship-preview destroyer-preview"></div>
                        <span class="ship-size">(2)</span>
                    </div>
                </div>
                <div class="setup-buttons">
                    <button id="rotate-btn">🔄 Rotate Ship</button>
                    <button id="random-btn">🎲 Random Setup</button>
                    <button id="start-btn" disabled>⚔️ Start Battle</button>
                </div>
            </div>
            <div class="setup-grid">
                <h3>Your Fleet</h3>
                <div class="grid" id="setup-grid"></div>
            </div>
        </div>

        <div class="game-boards" id="game-phase" style="display: none;">
            <div class="board-container">
                <div class="board player-board">
                    <h2>Your Fleet</h2>
                    <div class="grid" id="player-grid"></div>
                </div>
                <div class="board computer-board">
                    <h2>Enemy Waters</h2>
                    <div class="grid" id="computer-grid"></div>
                </div>
            </div>
        </div>

        <div class="game-over" id="game-over" style="display: none;">
            <div class="game-over-content">
                <h2 id="game-result"></h2>
                <p id="game-message"></p>
                <button id="restart-btn">🔄 Play Again</button>
            </div>
        </div>
    </div>

    <!-- Load AI first -->
    <script src="js/ai.js"></script>
    <!-- Then load game -->
    <script src="js/game.js"></script>
    
    <!-- Mobile-specific enhancements -->
    <script>
        // Mobile-specific initialization
        document.addEventListener('DOMContentLoaded', () => {
            // Add mobile class to body
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                document.body.classList.add('mobile-device');
            }
            
            // Prevent zoom on input focus (iOS)
            document.addEventListener('touchstart', () => {}, true);
            
            // Handle viewport changes
            let viewportMeta = document.querySelector('meta[name="viewport"]');
            
            function handleViewportChange() {
                if (window.innerHeight < window.innerWidth && window.innerWidth < 768) {
                    // Landscape on small screens
                    viewportMeta.setAttribute('content', 'width=device-width, initial-scale=0.8, maximum-scale=1.0, user-scalable=no');
                } else {
                    // Portrait or larger screens
                    viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                }
            }
            
            window.addEventListener('orientationchange', () => {
                setTimeout(handleViewportChange, 100);
            });
            
            window.addEventListener('resize', handleViewportChange);
            handleViewportChange();
        });
        
        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
