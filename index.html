<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой помощник</title>

    <!-- Шрифт Orbitron для заголовков -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Tabler Icons (web font) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🐭 Мой помощник</h1>
        </header>

        <nav id="mainMenu">
            <button data-action="rates">💵 Курсы</button>
            <button data-action="weather">🌤️ Погода</button>
            <button data-action="mouse">🐭 День мыши</button>
            <button data-action="events">📅 События</button>
            <button data-action="games" class="nav-games">🎮 Игровая платформа</button>
        </nav>

        <main id="content">
            <p>👋 Загрузка...</p>
        </main>

        <button id="backBtn" style="display:none;">🔙 Назад</button>
    </div>

    <div id="battleship-container" style="display:none; position:fixed; inset:0; background:#0a0e27; z-index:999;">
        <div style="padding: 8px; background: #0f1b3d; display: flex; align-items: center; justify-content: space-between;">
            <span style="color: #00d4ff; font-weight: 600; font-size: 15px; text-shadow: 0 0 10px rgba(0,212,255,0.5);">⚓ Морской бой</span>
            <button id="closeBattleshipBtn" style="background: rgba(0,212,255,0.2); border: 1px solid rgba(0,212,255,0.4); color: #00d4ff; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">✖ Закрыть</button>
        </div>
        <iframe id="battleship-frame" src="" style="width: 100%; height: calc(100vh - 48px); border: none; display: block;"></iframe>
    </div>

    <div id="confirmModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>⚠️ Удалить событие?</h3>
            <p id="confirmText">—</p>
            <div class="modal-buttons">
                <button id="confirmCancel" class="btn-secondary">Отмена</button>
                <button id="confirmDelete" class="btn-danger">🗑️ Удалить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
