<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой помощник</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>🐭 Мой помощник</h1>
        </header>

        <nav id="mainMenu">
            <button onclick="showRates()">💵 Курсы</button>
            <button onclick="showWeather()">🌤️ Погода</button>
            <button onclick="showMouseDay()">🐭 День мыши</button>
            <button onclick="showEvents()">📅 События</button>
        </nav>

        <main id="content">
            <p>👋 Загрузка...</p>
        </main>

        <button id="backBtn" style="display:none;" onclick="goBack()">🔙 Назад</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
