<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой помощник</title>

    <!-- Шрифт Orbitron для заголовков -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css?v=124">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Tabler Icons (web font) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🐭 Мой помощник</h1>
        </header>

        <nav id="mainMenu">
            <button data-action="rates">💵 Курсы</button>
            <button data-action="weather">🌤️ Погода</button>
            <button data-action="mouse">🐭 День мыши</button>
            <button data-action="events">📅 События</button>
            <button data-action="games" class="nav-games">🎮 Игровая платформа</button>
            <button data-action="radio" class="nav-games">📻 Магнитофон</button>
            <button data-action="video" class="nav-games">📼 Видак</button>
        </nav>

        <main id="content">
            <div class="dos-terminal">C:\&gt; <span class="dos-cursor"></span></div>
        </main>

        <button id="backBtn" style="display:none;">🔙 Назад</button>
    </div>

    <div id="dos-splash"><div class="dos-terminal" id="dosTerm">C:\&gt; <span class="dos-cursor"></span></div></div>

    <div id="battleship-container" style="display:none; position:fixed; inset:0; background:#0a0e27; z-index:999;">
        <iframe id="battleship-frame" src="" style="width: 100%; height: 100vh; border: none; display: block;"></iframe>
        <button id="closeBattleshipBtn" style="position:fixed; top:12px; right:12px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:18px; cursor:pointer; z-index:1000; transition:opacity 0.3s;">✖</button>
        <button id="fullscreenBtn" style="position:fixed; top:12px; right:56px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:16px; cursor:pointer; z-index:1000; transition:opacity 0.3s;">⛶</button>
    </div>

    <div id="confirmModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>⚠️ Удалить событие?</h3>
            <p id="confirmText">—</p>
            <div class="modal-buttons">
                <button id="confirmCancel" class="btn-secondary">Отмена</button>
                <button id="confirmDelete" class="btn-danger">🗑️ Удалить</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=124"></script>
</body>
</html>
