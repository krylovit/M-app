<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эмулятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game {
            width: 100%;
            height: 100%;
        }

        /* Виртуальный джойстик */
        #touch-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px;
            pointer-events: none;
            z-index: 9999;
        }
        #touch-controls.active { display: block; }
        .dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }
        .dpad-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #00d4ff;
            cursor: pointer;
        }
        .dpad-btn:active { background: rgba(0, 212, 255, 0.4); }
        .dpad-up    { top: 0; left: 40px; }
        .dpad-down  { bottom: 0; left: 40px; }
        .dpad-left  { top: 40px; left: 0; }
        .dpad-right { top: 40px; right: 0; }

        .action-btns {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .act-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 170, 0, 0.15);
            border: 2px solid rgba(255, 170, 0, 0.4);
            color: #ffaa00;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .act-btn:active { background: rgba(255, 170, 0, 0.4); }
        .act-btn.small { width: 44px; height: 44px; font-size: 11px; }

        .center-btns {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }
        .center-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #8892b0;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .center-btn:active { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <div id="game"></div>

    <div id="touch-controls">
        <div class="dpad">
            <div class="dpad-btn dpad-up" data-key="ArrowUp">▲</div>
            <div class="dpad-btn dpad-down" data-key="ArrowDown">▼</div>
            <div class="dpad-btn dpad-left" data-key="ArrowLeft">◀</div>
            <div class="dpad-btn dpad-right" data-key="ArrowRight">▶</div>
        </div>
        <div class="center-btns">
            <div class="center-btn" data-key="Select">SELECT</div>
            <div class="center-btn" data-key="Start">START</div>
        </div>
        <div class="action-btns">
            <div class="act-btn small" data-key="KeyB">B</div>
            <div class="act-btn" data-key="KeyA">A</div>
        </div>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var romPath = params.get('rom') || '';
        var coreType = params.get('core') || 'nes';

        EJS_player = '#game';
        EJS_core = coreType;
        EJS_gameUrl = romPath;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_startOnLoaded = true;
        EJS_VirtualGamepadSettings = [];
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    <script>
    (function() {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
        if (isMobile) {
            document.getElementById('touch-controls').classList.add('active');
        }

        var keyMap = {
            'ArrowUp': { code: 'ArrowUp', key: 'ArrowUp' },
            'ArrowDown': { code: 'ArrowDown', key: 'ArrowDown' },
            'ArrowLeft': { code: 'ArrowLeft', key: 'ArrowLeft' },
            'ArrowRight': { code: 'ArrowRight', key: 'ArrowRight' },
            'KeyA': { code: 'KeyA', key: 'a' },
            'KeyB': { code: 'KeyB', key: 'b' },
            'Start': { code: 'Enter', key: 'Enter' },
            'Select': { code: 'ShiftRight', key: 'Shift' }
        };

        function pressKey(keyId, isDown) {
            var k = keyMap[keyId];
            if (!k) return;
            var event = new KeyboardEvent(isDown ? 'keydown' : 'keyup', {
                code: k.code,
                key: k.key,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(event);
        }

        document.querySelectorAll('.dpad-btn, .act-btn, .center-btn').forEach(function(btn) {
            var keyId = btn.getAttribute('data-key');
            if (!keyId) return;

            var start = function(e) { e.preventDefault(); pressKey(keyId, true); };
            var end = function(e) { e.preventDefault(); pressKey(keyId, false); };

            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        });
    })();
    </script>
</body>
</html>
