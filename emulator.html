<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эмулятор</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const romPath = params.get('rom') || '';
        const coreType = params.get('core') || 'nes';
        const gameName = params.get('name') || 'game';
        const apiUrl = params.get('api') || '';
        const saveHeaders = apiUrl ? { 'ngrok-skip-browser-warning': 'true' } : {};

        EJS_player = '#game';
        EJS_core = coreType;
        EJS_gameUrl = romPath;
        EJS_gameName = gameName;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_startOnLoaded = true;
        EJS_VirtualGamepadSettings = [
            { type: 'zone', location: 'left', left: '50%', top: '50%', joystickInput: false, color: 'green', inputValues: [4, 5, 6, 7] },
            { type: 'button', text: 'B', id: 'b', location: 'right', left: 50, top: 50, bold: true, input_value: 0 },
            { type: 'button', text: 'A', id: 'a', location: 'right', left: 90, top: 10, bold: true, input_value: 8 },
            { type: 'button', text: 'Select', id: 'select', location: 'center', left: -10, fontSize: 15, block: true, input_value: 2 },
            { type: 'button', text: 'Start', id: 'start', location: 'center', left: 50, fontSize: 15, block: true, input_value: 3 }
        ];
        EJS_language = 'en';
        EJS_disableLocalStorage = true;

        EJS_onSaveState = function(e) {
            if (!apiUrl) return;
            fetch(apiUrl + '/api/emu_save?game=' + encodeURIComponent(gameName) + '&type=state', {
                method: 'POST',
                headers: saveHeaders,
                body: e.state
            }).then(function(r) { return r.json(); }).then(function(d) {
                logMsg('info', 'Save state synced: ' + (d.success ? 'OK (' + d.size + ' bytes)' : 'FAIL'));
            }).catch(function(err) {
                logMsg('err', 'Save state failed: ' + err.message);
            });
        };

        EJS_onLoadState = function() {
            if (!apiUrl) return;
            fetch(apiUrl + '/api/emu_load?game=' + encodeURIComponent(gameName) + '&type=state', {
                headers: saveHeaders
            }).then(function(r) {
                if (!r.ok) { logMsg('info', 'No save state found'); return null; }
                return r.arrayBuffer();
            }).then(function(buf) {
                if (buf && window.EJS_emulator) {
                    window.EJS_emulator.gameManager.loadState(new Uint8Array(buf));
                    logMsg('info', 'Save state loaded from server');
                }
            }).catch(function(err) {
                logMsg('err', 'Load state failed: ' + err.message);
            });
        };

        EJS_onSaveSave = function(e) {
            if (!apiUrl) return;
            fetch(apiUrl + '/api/emu_save?game=' + encodeURIComponent(gameName) + '&type=sram', {
                method: 'POST',
                headers: saveHeaders,
                body: e.save
            }).then(function(r) { return r.json(); }).then(function(d) {
                logMsg('info', 'SRAM synced: ' + (d.success ? 'OK (' + d.size + ' bytes)' : 'FAIL'));
            }).catch(function(err) {
                logMsg('err', 'Save SRAM failed: ' + err.message);
            });
        };

        EJS_onLoadSave = function() {
            if (!apiUrl) return;
            fetch(apiUrl + '/api/emu_load?game=' + encodeURIComponent(gameName) + '&type=sram', {
                headers: saveHeaders
            }).then(function(r) {
                if (!r.ok) { logMsg('info', 'No SRAM found'); return null; }
                return r.arrayBuffer();
            }).then(function(buf) {
                if (buf && window.EJS_emulator) {
                    var saveData = new Uint8Array(buf);
                    window.EJS_emulator.gameManager.loadSaveFiles(saveData);
                    logMsg('info', 'SRAM loaded from server');
                }
            }).catch(function(err) {
                logMsg('err', 'Load SRAM failed: ' + err.message);
            });
        };

        EJS_onGameStart = function() {
            logMsg('info', 'Game started, loading saves from server...');
            if (EJS_onLoadState) EJS_onLoadState();
            if (EJS_onLoadSave) EJS_onLoadSave();
        };
    </script>

    <script>
    (function() {
        window.logMsg = function logMsg(type, msg) {
            var time = new Date().toLocaleTimeString();
            var line = '[' + time + '] ' + msg;
            try {
                window.parent.postMessage({ type: 'emuLog', logType: type, msg: line }, '*');
            } catch(e) {}
        }

        window.addEventListener('error', function(e) {
            logMsg('err', 'ERROR: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
        });

        window.addEventListener('unhandledrejection', function(e) {
            var reason = e.reason;
            var detail = '';
            if (reason && typeof reason === 'object') {
                detail = reason.message || reason.name || '';
                if (reason.stack) detail += '\n' + reason.stack;
                try { detail += ' ' + JSON.stringify(reason); } catch(ex) {}
            } else {
                detail = String(reason || 'unknown');
            }
            logMsg('err', 'PROMISE REJECT: ' + detail);
        });

        var origError = console.error;
        console.error = function() {
            var args = Array.prototype.slice.call(arguments).map(function(a) {
                return typeof a === 'object' ? JSON.stringify(a) : String(a);
            }).join(' ');
            logMsg('err', 'console.error: ' + args);
            origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
            var args = Array.prototype.slice.call(arguments).map(function(a) {
                return typeof a === 'object' ? JSON.stringify(a) : String(a);
            }).join(' ');
            logMsg('warn', 'console.warn: ' + args);
            origWarn.apply(console, arguments);
        };

        logMsg('info', 'Emulator started: core=' + coreType + ' rom=' + romPath);
    })();
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
