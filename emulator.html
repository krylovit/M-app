<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эмулятор</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const romPath = params.get('rom') || '';
        const coreType = params.get('core') || 'nes';
        const gameName = params.get('name') || 'game';
        const apiUrl = params.get('api') || '';
        const saveHeaders = apiUrl ? { 'ngrok-skip-browser-warning': 'true' } : {};

        EJS_player = '#game';
        EJS_core = coreType;
        EJS_gameUrl = romPath;
        EJS_gameName = gameName;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_startOnLoaded = true;
        EJS_VirtualGamepadSettings = [
            { type: 'zone', location: 'left', left: '50%', top: '50%', joystickInput: false, color: 'green', inputValues: [4, 5, 6, 7] },
            { type: 'button', text: 'B', id: 'b', location: 'right', left: 50, top: 50, bold: true, input_value: 0 },
            { type: 'button', text: 'A', id: 'a', location: 'right', left: 90, top: 10, bold: true, input_value: 8 },
            { type: 'button', text: 'Select', id: 'select', location: 'center', left: -10, fontSize: 15, block: true, input_value: 2 },
            { type: 'button', text: 'Start', id: 'start', location: 'center', left: 50, fontSize: 15, block: true, input_value: 3 }
        ];
        EJS_language = 'en';
        EJS_disableLocalStorage = true;
        EJS_cacheConfig = { enabled: false };

        EJS_onGameStart = function() {
            logMsg('info', 'Game started (no save mode)');
        };
        EJS_onExit = function() {
            logMsg('err', 'EJS_onExit fired - emulator closed itself');
        };
    </script>

    <script>
    (function() {
        window.logMsg = function logMsg(type, msg) {
            var time = new Date().toLocaleTimeString();
            var line = '[' + time + '] ' + msg;
            try {
                window.parent.postMessage({ type: 'emuLog', logType: type, msg: line }, '*');
            } catch(e) {}
        }

        window.addEventListener('error', function(e) {
            logMsg('err', 'ERROR: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
            e.preventDefault();
            return true;
        });

        window.addEventListener('beforeunload', function() {
            logMsg('err', 'PAGE UNLOADING - game may have crashed');
        });

        window.addEventListener('unhandledrejection', function(e) {
            var reason = e.reason;
            var detail = '';
            if (reason && typeof reason === 'object') {
                detail = reason.message || reason.name || reason.constructor.name || '';
                if (reason.stack) detail += '\n' + reason.stack;
                try { detail += ' ' + JSON.stringify(reason); } catch(ex) {}
            } else {
                detail = String(reason || 'unknown');
            }
            logMsg('err', 'PROMISE REJECT: ' + detail);
            e.preventDefault();
            e.stopPropagation();
        });

        var origError = console.error;
        console.error = function() {
            var args = Array.prototype.slice.call(arguments).map(function(a) {
                return typeof a === 'object' ? JSON.stringify(a) : String(a);
            }).join(' ');
            logMsg('err', 'console.error: ' + args);
            origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
            var args = Array.prototype.slice.call(arguments).map(function(a) {
                return typeof a === 'object' ? JSON.stringify(a) : String(a);
            }).join(' ');
            logMsg('warn', 'console.warn: ' + args);
            origWarn.apply(console, arguments);
        };

        logMsg('info', 'Emulator started: core=' + coreType + ' rom=' + romPath);
        logMsg('info', 'BUILD: wakeLock-fix2');
    })();
    </script>
    <script>
    (function() {
        function FakeReq() {
            var fakeTx = new Proxy({}, { get: function(t, p) { if (p === 'objectStore') return function() { return fakeStore(); }; if (p === 'abort' || p === 'commit') return function() {}; return fakeStore(); } });
            var req = { onsuccess: null, onerror: null, onupgradeneeded: null, result: undefined, error: null, readyState: 'done', source: null, transaction: fakeTx };
            setTimeout(function() { if (req.onsuccess) req.onsuccess({ target: req }); }, 0);
            return req;
        }
        function fakeStore() {
            return new Proxy({}, {
                get: function(t, prop) {
                    if (prop === 'indexNames') return { length: 0, contains: function() { return false; } };
                    if (prop === 'name') return 'store';
                    if (prop === 'keyPath') return null;
                    if (prop === 'transaction') return null;
                    if (prop === 'autoIncrement') return false;
                    if (typeof prop === 'string' && prop !== 'then') return FakeReq;
                    return undefined;
                },
                has: function() { return true; }
            });
        }
        function fakeDB() {
            return new Proxy({}, {
                get: function(t, prop) {
                    if (prop === 'name') return 'fake';
                    if (prop === 'version') return 1;
                    if (prop === 'objectStoreNames') return { length: 1, contains: function() { return true; }, item: function() { return 'store'; } };
                    if (prop === 'createObjectStore') return function() { return fakeStore(); };
                    if (prop === 'deleteObjectStore') return function() {};
                    if (prop === 'transaction') return function() { return new Proxy({}, { get: function(t, p) { if (p === 'objectStore') return function() { return fakeStore(); }; if (p === 'abort' || p === 'commit') return function() {}; return fakeStore(); } }); };
                    if (prop === 'close') return function() {};
                    if (prop === 'onversionchange') return null;
                    return undefined;
                }
            });
        }
        var _fakeDB = fakeDB();
        var fakeIDB = {
            open: function() { var req = FakeReq(); req.result = _fakeDB; setTimeout(function() { if (req.onupgradeneeded) req.onupgradeneeded({ target: req }); if (req.onsuccess) req.onsuccess({ target: req }); }, 0); return req; },
            deleteDatabase: function() { return FakeReq(); },
            databases: function() { return Promise.resolve([]); },
            cmp: function() { return 0; }
        };
        try { Object.defineProperty(window, 'indexedDB', { value: fakeIDB, writable: false, configurable: true }); } catch(e) { window.indexedDB = fakeIDB; }
        try { Object.defineProperty(window, 'caches', { value: { open: function() { return Promise.resolve({ match: function() { return Promise.resolve(undefined); }, put: function() { return Promise.resolve(); }, delete: function() { return Promise.resolve(); }, keys: function() { return Promise.resolve([]); } }); } }, configurable: true }); } catch(e) {}
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist = function() { return Promise.resolve(true); };
        }
        if (navigator.storage && navigator.storage.estimate) {
            navigator.storage.estimate = function() { return Promise.resolve({ quota: 1073741824, usage: 0 }); };
        }
        if (navigator.wakeLock) {
            navigator.wakeLock.request = function() { return Promise.resolve({ released: true, type: 'screen', addEventListener: function() {}, removeEventListener: function() {}, release: function() { return Promise.resolve(); } }); };
        }
        try { Object.defineProperty(navigator, 'wakeLock', { value: { request: function() { return Promise.resolve({ released: true, type: 'screen', addEventListener: function() {}, removeEventListener: function() {}, release: function() { return Promise.resolve(); } }); } }, configurable: true }); } catch(e) {}
    })();
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
